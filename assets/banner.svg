<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Continuous background pulse & flow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 20 180;
      animation: beamFlow 7s linear infinite;
    }
    .floating-card {
      animation: cardFloat 5s ease-in-out infinite alternate;
    }
    .radar-arm {
      transform-origin: 1040px 100px;
      animation: radarSweep 10s linear infinite;
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="orb-glow" cx="240" cy="140" r="280" fill="url(#orbGlow1)" />
  <circle class="orb-glow" cx="960" cy="280" r="320" fill="url(#orbGlow2)" />

  <!-- Animated Circuit & Data Flow Lines (strictly behind text) -->
  <g opacity="0.35">
    <path d="M 0 100 Q 300 160 600 90 T 1200 120" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
    <path class="flow-line" d="M 0 100 Q 300 160 600 90 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glowFilter)" />
    
    <path d="M 0 320 Q 350 240 700 330 T 1200 300" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2" />
    <path class="flow-line" d="M 0 320 Q 350 240 700 330 T 1200 300" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#glowFilter)" style="animation-duration: 9s;" />
  </g>

  <!-- Dynamic Radar Indicator (Top Right Corner) -->
  <g opacity="0.4">
    <circle cx="1040" cy="100" r="50" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <circle cx="1040" cy="100" r="30" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="1040" cy="100" r="10" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />
    <line class="radar-arm" x1="1040" y1="100" x2="1085" y2="75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Subtle Ambient Tech Details -->
  <g opacity="0.45" font-family="monospace" font-size="11" fill="#64748b">
    <text x="60" y="50">SYSTEM // AUTONOMOUS_AGENT_ORCHESTRATION_LAYER</text>
    <text x="1000" y="50">ENV: SANDBOXED</text>
  </g>

  <!-- FOREGROUND: Content Cards, Title, Subtitle, & Feature Pills -->
  
  <!-- Status Badge Pill -->
  <g transform="translate(60, 75)">
    <rect width="260" height="30" rx="15" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="19" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="155" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glowFilter)">
    Autonomous AI Software Engineering
  </text>
  <text x="60" y="155" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">
    Autonomous AI Software Engineering
  </text>

  <!-- Secondary Title / Tagline -->
  <text x="60" y="200" fill="#94a3b8" font-size="20" font-weight="500">
    The Definitive Guide to Autonomous Coding Agents, Issue-to-PR Engines &amp; SWE Harnesses
  </text>

  <!-- Highlight Feature Pills (Floating dynamically) -->
  <g class="floating-card" transform="translate(60, 240)">
    <!-- Pill 1: Issue-to-PR Agents -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
      <text x="20" y="26" fill="#e2e8f0" font-size="13" font-weight="600">⚡ Issue-to-PR Agents</text>
    </g>

    <!-- Pill 2: SWE-bench Verified -->
    <g transform="translate(225, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" />
      <text x="20" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🏆 SWE-bench Verified</text>
    </g>

    <!-- Pill 3: Sandboxed Runtimes -->
    <g transform="translate(450, 0)">
      <rect width="220" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
      <text x="20" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🛡️ Sandboxed Runtimes</text>
    </g>

    <!-- Pill 4: Parallel Swarms -->
    <g transform="translate(685, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      <text x="20" y="26" fill="#e2e8f0" font-size="13" font-weight="600">🚀 Multi-Agent Swarms</text>
    </g>
  </g>

  <!-- Bottom Interactive Stats Banner Bar -->
  <g transform="translate(60, 320)">
    <rect width="1080" height="60" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    
    <g transform="translate(40, 36)">
      <text fill="#38bdf8" font-size="18" font-weight="800">10+ SaaS Platforms</text>
      <text x="180" fill="#64748b" font-size="14">|</text>
      <text x="210" fill="#a855f7" font-size="18" font-weight="800">25+ Open-Source Projects</text>
      <text x="445" fill="#64748b" font-size="14">|</text>
      <text x="475" fill="#10b981" font-size="18" font-weight="800">1M+ Total GitHub Stars Tracked</text>
      <text x="810" fill="#64748b" font-size="14">|</text>
      <text x="840" fill="#f59e0b" font-size="14" font-weight="700">★ Open Access</text>
    </g>
  </g>
</svg>
